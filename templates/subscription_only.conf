# MMWX subscription-only reverse proxy.
# Replace {domain} and {cert_name}, then place this file in the Nginx servers
# directory. The MMWX backend is expected to listen on 127.0.0.1:12889.
server {
    listen                     443 ssl;
    listen                     [::]:443 ssl;
    http2                      on;

    server_name                {domain};

    ssl_certificate            cert/{cert_name}.pem;
    ssl_certificate_key        cert/{cert_name}.key;
    ssl_protocols              TLSv1.2 TLSv1.3;

    # Allowed endpoints:
    #   /x/{code}                    short links and package subscription links
    #   /api/clash/subscribe         direct Clash/Mihomo subscriptions
    #   /api/user/package-subscribe  direct package subscriptions
    #   /api/subscribe               compatibility endpoint
    location ~ ^(?:/x/|/api/(?:clash/subscribe|user/package-subscribe|subscribe)$) {
        proxy_pass                          http://127.0.0.1:12889;
        proxy_http_version                  1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_buffering                     off;
        proxy_connect_timeout               60s;
        proxy_send_timeout                  60s;
        proxy_read_timeout                  60s;
    }

    # Do not expose the login page, management API, or frontend on this domain.
    location / {
        return 404;
    }
}
