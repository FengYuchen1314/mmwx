name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout paired Xray runtime
        run: git clone --depth 1 https://github.com/FengYuchen1314/Xray-core-mmwx.git ../Xray-core-mmwx
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the self-contained frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Test backend
        run: |
          # The fork deliberately keeps most historical *_test.go files out of
          # source control; run the maintained suites and compile storage
          # separately instead of failing on a missing legacy test helper.
          go test ./internal/handler ./internal/license ./internal/mcp ./cmd/server
          go build ./internal/storage

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: mmwx-linux-amd64
          - goos: linux
            goarch: arm64
            output: mmwx-linux-arm64
          - goos: darwin
            goarch: amd64
            output: mmwx-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: mmwx-darwin-arm64
          - goos: windows
            goarch: amd64
            output: mmwx-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Checkout paired Xray runtime
        run: git clone --depth 1 https://github.com/FengYuchen1314/Xray-core-mmwx.git ../Xray-core-mmwx
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o build/${{ matrix.output }} ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}
          retention-days: 7

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout paired Xray runtime
        run: git clone --depth 1 https://github.com/FengYuchen1314/Xray-core-mmwx.git ../Xray-core-mmwx
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            xray-core-fork=../Xray-core-mmwx
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum mmwx-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/mmwx-linux-amd64
            release/mmwx-linux-arm64
            release/mmwx-darwin-amd64
            release/mmwx-darwin-arm64
            release/mmwx-windows-amd64.exe
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
