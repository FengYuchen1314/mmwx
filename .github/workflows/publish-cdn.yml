name: Publish to R2 CDN

# 发版后把 agent 二进制 + version.json 推到 Cloudflare R2,供主控的 agent 版本检查/下载走 CDN
# (绕开 api.github.com 限流)。触发:GitHub Release 发布时。
# 需要的 Secrets(与主面板仓同名,可用 Organization Secrets 共享一份):
#   R2_ACCOUNT_ID        Cloudflare 账号 ID
#   R2_ACCESS_KEY_ID     R2 API Token 的 Access Key ID
#   R2_SECRET_ACCESS_KEY R2 API Token 的 Secret Access Key
#   R2_BUCKET            R2 bucket 名(与面板同一个 bucket 即可)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '手动补传的 release tag(如 v1.2.3)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Push agent binaries + version.json to R2
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      NOTES: ${{ github.event.release.body }}
      URL: ${{ github.event.release.html_url }}
      PROJECT: mmw-agent
    steps:
      - name: Download release assets (mmw-agent-*)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'mmw-agent-*' --dir dist
          ls -la dist

      - name: Generate version.json
        run: |
          jq -n \
            --arg version "$TAG" \
            --arg tag "$TAG" \
            --arg notes "${NOTES:-}" \
            --arg html_url "${URL:-}" \
            '{version:$version, tag:$tag, notes:$notes, html_url:$html_url}' > dist/version.json
          cat dist/version.json

      - name: Upload to R2 (S3-compatible)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for f in dist/mmw-agent-*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            aws s3 cp "$f" "s3://$BUCKET/$PROJECT/$name" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/octet-stream \
              --cache-control "public, max-age=86400"
          done
          aws s3 cp dist/version.json "s3://$BUCKET/$PROJECT/version.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=60"
          echo "已发布到 R2: $PROJECT/ (tag=$TAG)"
