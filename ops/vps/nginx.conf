# Cloudflare terminates the public certificate and connects to this origin in
# Full mode. The origin certificate is generated locally during bootstrap; no
# public certificate issuance is required.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name testpanel.anylocate.cc;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/testpanel.anylocate.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/testpanel.anylocate.cc.key;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testpanel.anylocate.cc;

    ssl_certificate /etc/nginx/ssl/testpanel.anylocate.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/testpanel.anylocate.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MMWX:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 512m;
    add_header X-MMWX-Reverse-Proxy "1" always;

    location / {
        proxy_pass http://127.0.0.1:12889;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates visitor TLS. The application needs this value
        # to generate canonical HTTPS URLs and secure cookies.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
