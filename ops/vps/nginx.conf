# This origin deliberately listens on HTTP only. Cloudflare's edge terminates
# HTTPS. Do not add an origin HTTP->HTTPS redirect while Cloudflare uses
# Flexible SSL, or HTTPS visitors will enter a redirect loop.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name testpanel.anylocate.cc;

    server_tokens off;
    client_max_body_size 512m;
    add_header X-MMWX-Reverse-Proxy "1" always;

    location / {
        proxy_pass http://127.0.0.1:12889;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates visitor TLS. The application needs this value
        # to generate canonical HTTPS URLs and secure cookies.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
