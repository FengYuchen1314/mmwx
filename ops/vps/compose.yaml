services:
  controller:
    image: ghcr.io/fengyuchen1314/mmwx-controller:latest
    container_name: mmwx-controller
    restart: unless-stopped
    environment:
      PORT: "12889"
      LOG_LEVEL: info
      TZ: Asia/Shanghai
    # Only the local Nginx reverse proxy can reach the controller. This keeps
    # the setup wizard and administration API off the public IP.
    ports:
      - "127.0.0.1:12889:12889"
    volumes:
      # These three bind mounts deliberately survive image replacement.
      - ./data:/app/data
      - ./subscribes:/app/subscribes
      - ./rule_templates:/app/rule_templates
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12889/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
